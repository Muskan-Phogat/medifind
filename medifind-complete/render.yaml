services:
  - type: web
    name: medifind-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DB_PATH
        value: /tmp/medifind.db
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: DEMO_ADMIN_KEY
        value: medifind-demo-secret-2025
      - key: PING_TIMEOUT_SECONDS
        value: "90"
      - key: USE_AI
        value: "false"
